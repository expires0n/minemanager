name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    name: Build portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile single EXE with the in-box .NET Framework compiler
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found: $csc" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /codepage:65001 /debug- `
            /win32icon:assets\app.ico `
            /resource:assets\logo64.png,MineManager.Resources.logo.png `
            /win32manifest:src\app.manifest `
            /out:dist\MineManager.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll `
            /r:System.Windows.Forms.dll /r:System.Management.dll `
            /recurse:src\*.cs
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed with exit code $LASTEXITCODE" }
          Get-Item dist\MineManager.exe | Select-Object Name, Length

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $stage = "MineManager-$version-portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist\MineManager.exe $stage\
          Copy-Item README.md, LICENSE, NOTICE, packaging\PORTABLE-README.txt $stage\
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -Force
          "ZIP_NAME=$stage.zip" >> $env:GITHUB_ENV

      - name: Verify portable zip contents
        shell: pwsh
        run: |
          $zip = Get-Item $env:ZIP_NAME
          "Portable package: $($zip.Name) - $([math]::Round($zip.Length / 1KB, 1)) KB"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries | ForEach-Object { $_.FullName }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          @"
          > **Public beta.** MineManager is actively developed: pages, tweak/config catalogues and
          > languages keep growing, and behaviour may change between beta releases. See
          > [ROADMAP.md](https://github.com/expires0n/minemanager/blob/main/ROADMAP.md) and the
          > [changelog](https://github.com/expires0n/minemanager/blob/main/CHANGELOG.md).

          **Portable build** — extract `$($env:ZIP_NAME)` anywhere and run `MineManager.exe`.
          No installer, no service, no runtime to install (.NET Framework 4.8 is in-box on
          Windows 10/11). Settings, the undo snapshot and registry backups are written next to the
          EXE, so deleting the folder removes everything.

          SHA-256 of the portable zip is attached by GitHub under "Assets".
          "@ | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $tag $env:ZIP_NAME `
            --title "MineManager $tag - beta" `
            --notes-file release-notes.md `
            --prerelease
